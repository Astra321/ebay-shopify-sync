# ── Web service (default) ──────────────────────────────────────────────────────
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npx prisma db push --accept-data-loss && npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/"
healthcheckTimeout = 30

[deploy.environmentVariables]
NODE_ENV = "production"

# ── Worker service ─────────────────────────────────────────────────────────────
# In Railway: add a second service from the same repo, override the start command:
#   startCommand = "npm run worker"
# The worker does NOT need npm run build, only the web service does.
# Required env vars for the worker service (same values as the web service):
#   DATABASE_URL, REDIS_URL, SHOPIFY_API_KEY, SHOPIFY_API_SECRET,
#   SHOPIFY_APP_URL, ENCRYPTION_KEY
